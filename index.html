<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QRCode Creator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --ink: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --line-hover: #d4d4d8;
    --accent: #18181b;
    --accent-text: #fafafa;
    --error: #dc2626;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    padding: 24px;
    -webkit-font-smoothing: antialiased;
  }

  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 36px;
    width: 100%;
    max-width: 400px;
  }

  h1 {
    margin: 0 0 6px;
    font-size: 19px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }

  p.subtitle {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.4;
  }

  .tabs {
    display: flex;
    gap: 20px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 20px;
  }

  .tab-btn {
    padding: 0 0 10px;
    border: none;
    border-radius: 0;
    background: transparent;
    color: var(--muted);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color 0.15s, border-color 0.15s;
  }

  .tab-btn:hover {
    color: var(--ink);
  }

  .tab-btn.active {
    color: var(--ink);
    border-bottom-color: var(--ink);
  }

  .input-group {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  .file-drop {
    display: block;
    border: 1px dashed var(--line-hover);
    border-radius: 10px;
    padding: 22px 16px;
    text-align: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    margin-bottom: 20px;
  }

  .file-drop:hover, .file-drop.dragover {
    border-color: var(--ink);
    background: #f4f4f5;
  }

  .file-drop input[type="file"] {
    display: none;
  }

  .file-drop .file-label {
    font-size: 13px;
    color: var(--muted);
  }

  .file-drop .file-name {
    font-size: 13px;
    color: var(--ink);
    font-weight: 500;
    margin-top: 6px;
  }

  .hint {
    font-size: 12px;
    color: var(--muted);
    margin: -14px 0 20px;
  }

  input[type="text"] {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--card);
    color: var(--ink);
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s;
  }

  input[type="text"]::placeholder {
    color: #a1a1aa;
  }

  input[type="text"]:focus {
    border-color: var(--ink);
  }

  button {
    padding: 10px 16px;
    border-radius: 8px;
    border: 1px solid transparent;
    background: var(--accent);
    color: var(--accent-text);
    font-size: 14px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s;
    white-space: nowrap;
  }

  button:hover {
    opacity: 0.85;
  }

  #qrcode-wrapper {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 240px;
    min-width: 240px;
    width: 100%;
  }

  #qrcode {
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .placeholder {
    color: #a1a1aa;
    font-size: 13px;
    max-width: 180px;
    text-align: center;
  }

  #download-btn {
    display: none;
    margin-top: 16px;
    width: 100%;
  }

  .error {
    color: var(--error);
    font-size: 12px;
    margin: -12px 0 18px;
    min-height: 14px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>QRCode Creator</h1>
  <p class="subtitle">Insere um URL ou escolhe um ficheiro para gerar o teu QRCode</p>

  <div class="tabs">
    <button class="tab-btn active" id="tab-url">URL</button>
    <button class="tab-btn" id="tab-file">Ficheiro</button>
  </div>

  <div class="panel active" id="panel-url">
    <div class="input-group">
      <input type="text" id="url-input" placeholder="https://exemplo.com" autofocus>
      <button id="generate-btn">Gerar</button>
    </div>
  </div>

  <div class="panel" id="panel-file">
    <label class="file-drop" id="file-drop">
      <input type="file" id="file-input">
      <div class="file-label" id="file-label">Clica para escolher um ficheiro ou arrasta-o para aqui</div>
      <div class="file-name" id="file-name"></div>
    </label>
  </div>

  <div class="error" id="error-msg"></div>
  <div class="hint" id="file-hint"></div>

  <div id="qrcode-wrapper">
    <div id="qrcode"></div>
    <div class="placeholder" id="placeholder">O teu QRCode vai aparecer aqui</div>
  </div>

  <button id="download-btn">Descarregar PNG</button>
</div>

<script>
  const input = document.getElementById('url-input');
  const generateBtn = document.getElementById('generate-btn');
  const downloadBtn = document.getElementById('download-btn');
  const qrcodeDiv = document.getElementById('qrcode');
  const placeholder = document.getElementById('placeholder');
  const errorMsg = document.getElementById('error-msg');
  const fileHint = document.getElementById('file-hint');

  const tabUrl = document.getElementById('tab-url');
  const tabFile = document.getElementById('tab-file');
  const panelUrl = document.getElementById('panel-url');
  const panelFile = document.getElementById('panel-file');
  const fileDrop = document.getElementById('file-drop');
  const fileInput = document.getElementById('file-input');
  const fileLabel = document.getElementById('file-label');
  const fileName = document.getElementById('file-name');

  const MAX_FILE_BYTES = 2000; // QR codes de leitura fiável só cabem uns ~2KB de dados

  let qrcode = null;
  let mode = 'url';

  function switchTab(newMode) {
    mode = newMode;
    errorMsg.textContent = '';
    fileHint.textContent = '';
    tabUrl.classList.toggle('active', mode === 'url');
    tabFile.classList.toggle('active', mode === 'file');
    panelUrl.classList.toggle('active', mode === 'url');
    panelFile.classList.toggle('active', mode === 'file');
  }

  function normalizeUrl(value) {
    const trimmed = value.trim();
    if (!trimmed) return null;
    if (/^[a-zA-Z][a-zA-Z0-9+.-]*:\/\//.test(trimmed)) return trimmed;
    return 'https://' + trimmed;
  }

  function renderQr(text) {
    qrcodeDiv.innerHTML = '';
    placeholder.style.display = 'none';

    qrcode = new QRCode(qrcodeDiv, {
      text: text,
      width: 220,
      height: 220,
      colorDark: '#18181b',
      colorLight: '#ffffff',
      correctLevel: QRCode.CorrectLevel.L
    });

    downloadBtn.style.display = 'block';
  }

  function generateFromUrl() {
    const raw = input.value;
    const url = normalizeUrl(raw);
    errorMsg.textContent = '';

    if (!url) {
      errorMsg.textContent = 'Insere um URL válido.';
      return;
    }

    renderQr(url);
  }

  function handleFile(file) {
    errorMsg.textContent = '';
    fileHint.textContent = '';

    if (!file) return;

    fileName.textContent = `${file.name} (${(file.size / 1024).toFixed(1)} KB)`;

    const reader = new FileReader();
    reader.onload = () => {
      const dataUrl = reader.result;

      if (dataUrl.length > MAX_FILE_BYTES * 1.37 + 50) {
        errorMsg.textContent = 'Ficheiro demasiado grande para caber num QRCode.';
        fileHint.textContent = `Máximo recomendado: ~${MAX_FILE_BYTES / 1000}KB. Este ficheiro tem ${(file.size / 1024).toFixed(1)}KB.`;
        return;
      }

      renderQr(dataUrl);
      fileHint.textContent = 'O QRCode contém o ficheiro codificado diretamente (base64).';
    };
    reader.onerror = () => {
      errorMsg.textContent = 'Não foi possível ler o ficheiro.';
    };
    reader.readAsDataURL(file);
  }

  function download() {
    const img = qrcodeDiv.querySelector('img');
    const canvas = qrcodeDiv.querySelector('canvas');
    const source = img && img.src ? img.src : (canvas ? canvas.toDataURL('image/png') : null);

    if (!source) return;

    const link = document.createElement('a');
    link.href = source;
    link.download = 'qrcode.png';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  tabUrl.addEventListener('click', () => switchTab('url'));
  tabFile.addEventListener('click', () => switchTab('file'));

  generateBtn.addEventListener('click', generateFromUrl);
  downloadBtn.addEventListener('click', download);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') generateFromUrl();
  });

  fileInput.addEventListener('change', () => handleFile(fileInput.files[0]));

  fileDrop.addEventListener('dragover', (e) => {
    e.preventDefault();
    fileDrop.classList.add('dragover');
  });
  fileDrop.addEventListener('dragleave', () => {
    fileDrop.classList.remove('dragover');
  });
  fileDrop.addEventListener('drop', (e) => {
    e.preventDefault();
    fileDrop.classList.remove('dragover');
    if (e.dataTransfer.files.length) {
      fileInput.files = e.dataTransfer.files;
      handleFile(e.dataTransfer.files[0]);
    }
  });
</script>

</body>
</html>
